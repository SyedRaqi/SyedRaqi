<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 90" width="560" height="90" role="img" aria-label="Enter the observatory: try the interactive 3D version" xmlns:c2pa="http://c2pa.org/manifest"><defs><linearGradient id="bt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a86ff"/><stop offset=".55" stop-color="#5fe0d0"/><stop offset="1" stop-color="#e8c36a"/></linearGradient><filter id="bl"><feGaussianBlur stdDeviation="8"/></filter><mask id="tm"><text x="280" y="49" text-anchor="middle" font-family="'DejaVu Sans',Verdana,sans-serif" font-weight="900" font-size="18" letter-spacing="2" fill="#fff">ENTER THE OBSERVATORY: TRY 3D  &#10140;</text></mask></defs>
<rect x="20" y="18" width="520" height="56" rx="28" fill="url(#bt)" opacity=".5" filter="url(#bl)"><animate attributeName="opacity" values=".3;.75;.3" dur="2.4s" repeatCount="indefinite"/></rect>
<g><animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2.4s" repeatCount="indefinite"/>
