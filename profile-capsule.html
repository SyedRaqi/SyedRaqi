<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Syed Raqi · Developer Capsule</title>
<style>
  :root{--lav:#b9a7ff;--mint:#8ef0d0;--pink:#ffb8a1;--sky:#9bd3ff;--ink:#1d1838;--rx:0deg;--ry:0deg}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;overflow:hidden;background:#0c0d19;color:#e6dcff;font-family:Verdana,'DejaVu Sans',sans-serif}
  body{background:radial-gradient(900px 600px at 50% 55%,#2a2358 0%,#15172b 55%,#0c0d19 100%)}
  .stars{position:fixed;inset:0;pointer-events:none}
  .stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.2;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.95}}
  .stage{position:fixed;inset:0;perspective:1500px;display:flex;align-items:center;justify-content:center}
  .scene{position:relative;width:0;height:0;transform-style:preserve-3d;will-change:transform}
  .abs{position:absolute;transform-style:preserve-3d}
  .face{position:absolute;left:50%;top:50%;backface-visibility:hidden}
  .bb{transform:rotateY(calc(-1 * var(--ry))) rotateX(calc(-1 * var(--rx)))}
  .hud{position:fixed;left:32px;top:28px;z-index:5;pointer-events:none}
  .hud small{letter-spacing:.35em;font-size:12px;color:var(--pink);font-weight:700}
  .hud h1{font-size:clamp(34px,6vw,64px);line-height:1.05;font-weight:900;background:linear-gradient(120deg,#e6dcff,#8ef0d0 55%,#ffb8a1);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 1px rgba(0,0,0,.2)}
  .hud p{margin-top:10px;font-family:'DejaVu Sans Mono',Consolas,monospace;font-size:14px;color:#a99fe0}
  .hint{position:fixed;left:0;right:0;bottom:22px;text-align:center;font-size:12px;letter-spacing:.3em;color:#8d83c8;pointer-events:none}
  .lines{position:absolute;inset:8px 10px;overflow:hidden}
  .lines b{display:block;height:6px;border-radius:3px;margin:7px 0;width:0;animation:type 6s ease-in-out infinite}
  @keyframes type{0%{width:0}25%,85%{width:var(--w)}100%{width:0}}
  .steam{position:absolute;width:10px;height:18px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(4px);animation:rise 3s ease-in infinite}
  @keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-46px) scale(1.5);opacity:0}}
  @keyframes spin{to{transform:rotateY(360deg)}}
  @keyframes bob{50%{transform:translateY(-10px)}}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="stars" id="stars"></div>
<div class="hud"><small>HI, I&rsquo;M</small><h1>Syed Raqi</h1><p>Building web apps &middot; <a href="https://github.com/SyedRaqi" style="color:#8ef0d0">github.com/SyedRaqi</a></p></div>
<div class="stage"><div class="scene" id="scene"></div></div>
<div class="hint">MOVE YOUR MOUSE TO TILT THE CAPSULE</div>
<script>
const $=(t,c,s,p)=>{const e=document.createElement(t);if(c)e.className=c;if(s)Object.assign(e.style,s);if(p)p.appendChild(e);return e};
const scene=document.getElementById('scene');
// stars
for(let i=0;i<70;i++){const s=$('i',0,{left:Math.random()*100+'%',top:Math.random()*100+'%',animationDelay:(-Math.random()*3)+'s'},document.getElementById('stars'))}
// box helper: w=x, h=y, d=z; cols=[front,back,right,left,top,bottom]
function box(w,h,d,cols,parent,pos){
  const b=$('div','abs',{transform:`translate3d(${pos[0]}px,${pos[1]}px,${pos[2]}px)`},parent);
  const f=(cw,ch,tr,bg)=>$('div','face',{width:cw+'px',height:ch+'px',marginLeft:-cw/2+'px',marginTop:-ch/2+'px',transform:tr,background:bg},b);
  const faces=[f(w,h,`translateZ(${d/2}px)`,cols[0]),f(w,h,`rotateY(180deg) translateZ(${d/2}px)`,cols[1]),f(d,h,`rotateY(90deg) translateZ(${w/2}px)`,cols[2]),f(d,h,`rotateY(-90deg) translateZ(${w/2}px)`,cols[3]),f(w,d,`rotateX(90deg) translateZ(${h/2}px)`,cols[4]),f(w,d,`rotateX(-90deg) translateZ(${h/2}px)`,cols[5])];
  b.faces=faces;return b;
}
function cyl(r,h,seg,color,parent,pos,cap){
  const c=$('div','abs',{transform:`translate3d(${pos[0]}px,${pos[1]}px,${pos[2]}px)`},parent);
  const w=2*Math.PI*r/seg+1.5;
  for(let i=0;i<seg;i++)$('div','face',{width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',background:color,transform:`rotateY(${i*360/seg}deg) translateZ(${r}px)`,filter:`brightness(${.8+.3*Math.cos(i/seg*Math.PI*2)})`,backfaceVisibility:'hidden'},c);
  if(cap)$('div','face',{width:2*r+'px',height:2*r+'px',marginLeft:-r+'px',marginTop:-r+'px',borderRadius:'50%',background:cap,transform:`rotateX(90deg) translateZ(${h/2}px)`},c);
  return c;
}
const P='linear-gradient(135deg,#ffe3c9,#e7b896)', P2='#d9a37e', P3='#f1c9a6';
// base pedestal
cyl(200,26,48,'linear-gradient(#9d92d8,#6f66ad)',scene,[0,262,0],'radial-gradient(circle,#efe8ff 0%,#b9aef0 70%,#8e84c9 100%)');
$('div','face',{width:340+'px',height:340+'px',marginLeft:'-170px',marginTop:'-170px',borderRadius:'50%',border:'3px solid #8ef0d0',boxShadow:'0 0 24px #8ef0d0, inset 0 0 24px #8ef0d0',transform:'translateY(248px) rotateX(90deg)',animation:'pulse 3s ease-in-out infinite'},$('div','abs',{},scene));
// glass capsule: camera-facing front and back shells (no intersections with the contents) plus rings
function shell(z,scale,rim,fill){
  const w=$('div','abs',{},scene);
  const b=$('div',0,{transformStyle:'preserve-3d',transform:`rotateY(calc(-1 * var(--ry))) rotateX(calc(-1 * var(--rx))) translateZ(${z}px)`},w);
  $('div',0,{position:'absolute',width:(330/scale)+'px',height:(480/scale)+'px',marginLeft:(-165/scale)+'px',marginTop:(-235/scale)+'px',borderRadius:(165/scale)+'px',border:rim,background:fill,pointerEvents:'none'},b);
  return b;
}
shell(-420,1500/(1500+420),'1.5px solid rgba(200,210,255,.22)','linear-gradient(135deg,rgba(140,150,255,.05),rgba(0,0,0,0))');
[-228,228].forEach(y=>{const r=$('div','abs',{},scene);$('div','face',{width:'330px',height:'330px',marginLeft:'-165px',marginTop:'-165px',borderRadius:'50%',border:'1.5px solid rgba(220,225,255,.28)',transform:`translateY(${y}px) rotateX(90deg)`},r)});
// desk
const desk=$('div','abs',{},scene);
box(280,18,190,[P,P,P2,P2,P3,P2],desk,[0,95,0]);
// laptop
const lap=$('div','abs',{},desk);
box(120,6,84,['#cbbfff','#cbbfff','#9d8cff','#9d8cff','#e6dcff','#9d8cff'],lap,[-50,83,-6]);
for(let r=0;r<3;r++)for(let c=0;c<7;c++)$('div','face',{width:'11px',height:'7px',marginLeft:(-52+c*14-50+0)+'px',marginTop:(-30+r*11+(-6)-0)+'px',background:'#b8a9f2',borderRadius:'2px',transform:`translate3d(0,0,0) rotateX(90deg) translateZ(-86px)`,display:'none'},lap);
const hinge=$('div','abs',{transform:'translate3d(-50px,79px,-46px) rotateX(-14deg)'},lap);
const scr=box(120,76,5,['url(#)','#7b6ad8','#7b6ad8','#7b6ad8','#cbbfff','#7b6ad8'],hinge,[0,-38,0]);
const sf=scr.faces[0];sf.style.background='linear-gradient(135deg,#1c1b3a,#2b2660)';sf.style.boxShadow='0 0 28px rgba(142,240,208,.55)';
const lines=$('div','lines',{},sf);
[['#8ef0d0',.62],['#ffb8a1',.4],['#9bd3ff',.78],['#ffe7a3',.5],['#b9a7ff',.7],['#8ef0d0',.34],['#ffb8a1',.58],['#9bd3ff',.44]].forEach(([c,w],i)=>{const b=$('b',0,{background:c,animationDelay:i*.4+'s'},lines);b.style.setProperty('--w',(w*100)+'%')});
// mug
const mug=$('div','abs',{},desk);
cyl(20,34,18,'#ff9fb8',mug,[88,70,34],'radial-gradient(circle,#7a4a3a 0 62%,#ffd1dc 66%)');
const handle=$('div','face',{width:'22px',height:'20px',marginLeft:'20px',marginTop:'-10px',border:'5px solid #ff9fb8',borderLeft:'none',borderRadius:'0 14px 14px 0',transform:'translate3d(88px,70px,34px)'},mug);
const steamBox=$('div','abs',{transform:'translate3d(88px,40px,34px)'},mug);
for(let i=0;i<3;i++){const w=$('div','abs',{},steamBox);const b=$('div','bb',{transformStyle:'flat'},w);$('div','steam',{left:(-14+i*10)+'px',animationDelay:i*.9+'s'},b)}
// plant
const plant=$('div','abs',{transform:'translate3d(-104px,60px,56px)'},desk);
cyl(15,24,14,'#ffb8a1',plant,[0,12,0],'#7a4a3a');
[[-24,'#8ef0d0'],[0,'#a7f7de'],[24,'#6fe0bd']].forEach(([ang,c])=>{const w=$('div','abs',{transform:`translateY(0px) rotateZ(${ang}deg)`},plant);cyl(3.5,40,8,c,w,[0,-22,0],c)});
// floating icons: projected by hand into a flat overlay so they never clip against the 3D scene
const layer=$('div',0,{position:'fixed',inset:'0',pointerEvents:'none',zIndex:'3'},document.body);
const tiles=['</>','{ }','#','Py'].map((g,i)=>{
  const cols=['#b9a7ff','#8ef0d0','#ffb8a1','#9bd3ff'];
  const t=$('div',0,{position:'absolute',left:'0',top:'0',width:'46px',height:'46px',borderRadius:'14px',background:cols[i],color:'#1d1838',font:'700 17px "DejaVu Sans Mono",monospace',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'inset 0 15px 0 rgba(255,255,255,.22), 0 8px 24px rgba(0,0,0,.35)',willChange:'transform'},layer);
  t.textContent=g;return t;
});
function placeTiles(t,rx,ry,s){
  const R=Math.PI/180,cy_=Math.cos(ry*R),sy=Math.sin(ry*R),cx_=Math.cos(rx*R),sx=Math.sin(rx*R);
  tiles.forEach((el,i)=>{
    const a=t/2600+i*Math.PI/2;
    let x=150*Math.cos(a), y=-150+8*Math.sin(t/480+i*1.7), z=150*Math.sin(a);
    let x1=x*cy_+z*sy, z1=-x*sy+z*cy_;
    let y1=y*cx_-z1*sx, z2=y*sx+z1*cx_;
    x1*=s;y1*=s;z2*=s;
    const k=1500/(1500-z2), px=innerWidth/2+x1*k, py=innerHeight/2+y1*k;
    el.style.transform=`translate(${px-23}px,${py-23}px) scale(${s*k})`;
    el.style.zIndex=Math.round(z2+1000);
    el.style.opacity=Math.max(.35,Math.min(1,.7+z2/260));
  });
}
// front glass layer (billboard, drawn nearest to the camera)
shell(420,1500/(1500-420),'2px solid rgba(235,238,255,.55)','linear-gradient(135deg,rgba(255,255,255,.12),rgba(170,200,255,.02) 50%,rgba(255,255,255,.09))');
// glass highlight (billboard)
const hl=$('div','abs',{transform:'translate3d(0,0,0)'},scene);
const hb=$('div',0,{transformStyle:'preserve-3d',transform:'rotateY(calc(-1 * var(--ry))) rotateX(calc(-1 * var(--rx))) translateZ(430px)'},hl);
$('div',0,{position:'absolute',left:'-120px',top:'-170px',width:'46px',height:'220px',borderLeft:'7px solid rgba(255,255,255,.45)',borderRadius:'120px 0 0 120px',filter:'blur(.4px)'},hb);
// tilt control
let tx=0,ty=0,cx=0,cy=0,last=0;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function setT(x,y){tx=(x-.5)*70;ty=(y-.5)*-32;last=performance.now()}
addEventListener('pointermove',e=>setT(e.clientX/innerWidth,e.clientY/innerHeight));
addEventListener('touchmove',e=>{const t=e.touches[0];setT(t.clientX/innerWidth,t.clientY/innerHeight)},{passive:true});
function resize(){const s=Math.min(innerWidth/820,innerHeight/760,1.15);scene.dataset.s=s}
addEventListener('resize',resize);resize();
function frame(t){
  if(!reduce&&t-last>2500){tx=Math.sin(t/2600)*34;ty=Math.cos(t/3300)*8}
  cx+=(tx-cx)*.08;cy+=(ty-cy)*.08;
  const ry=-28+cx, rx=-17+cy, s=scene.dataset.s;
  document.documentElement.style.setProperty('--ry',ry+'deg');
  document.documentElement.style.setProperty('--rx',rx+'deg');
  scene.style.transform=`scale(${s}) rotateX(${rx}deg) rotateY(${ry}deg)`;
  placeTiles(t,rx,ry,+s);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
